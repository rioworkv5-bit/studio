<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Studio</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0e0f12;--card:#171920;--line:#2a2d36;--txt:#eceef3;--mute:#9aa0ad;--acc:#b6f03c;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font:16px system-ui,"Segoe UI",Tahoma,sans-serif;padding:16px}
.card{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
h1{margin:0 0 6px;font-size:26px}h1 b{color:var(--acc)}p{color:var(--mute);margin:0 0 22px;line-height:1.7}
#g{display:flex;justify-content:center;min-height:44px}
.st{margin-top:18px;font-size:14px;color:var(--mute);line-height:1.7}.st.bad{color:var(--warn)}
a.alt{display:inline-block;margin-top:14px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>AI <b>Studio</b></h1>
  <p>ادخل بحساب جوجل بتاعك.<br>لازم يكون صاحب الاستوديو ضاف الإيميل بتاعك.</p>
  <div id="g"></div>
  <div class="st" id="st">… بيشوف الاستوديو شغال ولا لأ</div>
  <a class="alt" id="alt" hidden>ادخل باسم حساب وباسورد</a>
</div>
<script>
// The studio runs on the owner's computer; its address changes on every restart, and the computer writes the current one
// into studio.json here. This page stays at the same link, signs in with Google, and hands the signed token to the studio.
(async () => {
  const st = document.getElementById('st'), bad = t => { st.className = 'st bad'; st.textContent = t; };
  let cfg; try { cfg = await (await fetch('studio.json?' + Date.now(), { cache: 'no-store' })).json(); } catch { return bad('مش لاقي عنوان الاستوديو. جرّب كمان شوية.'); }
  const alt = document.getElementById('alt'); alt.href = cfg.url + '/login.html'; alt.hidden = false;
  try { await fetch(cfg.url + '/login.html', { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(10000) }); st.textContent = '✓ الاستوديو شغال'; }
  catch { return bad('الاستوديو مقفول دلوقتي (الكمبيوتر بتاعه مطفي أو البرنامج مش شغال). جرّب بعدين.'); }
  if (!cfg.clientId) { st.textContent += ' · الدخول بجوجل لسه بيتجهّز'; return; }
  const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = () => {
    google.accounts.id.initialize({ client_id: cfg.clientId, ux_mode: 'popup', callback: r => { st.textContent = '… بيدخّلك'; location.href = cfg.url + '/auth.html#cred=' + encodeURIComponent(r.credential); } });
    google.accounts.id.renderButton(document.getElementById('g'), { theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ar' });
  };
  document.head.append(s);
})();
</script>
</body>
</html>
